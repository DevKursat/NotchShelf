name: macOS CI/CD Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build & Release NotchShelf
    runs-on: macos-14 # Apple Silicon M-Series
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_15.4.app
      
    - name: Build and Archive
      run: |
        xcodebuild archive \
          -project NotchShelf.xcodeproj \
          -scheme NotchShelf \
          -configuration Release \
          -archivePath $PWD/build/NotchShelf.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Export Archive
      run: |
        xcodebuild -exportArchive \
          -archivePath $PWD/build/NotchShelf.xcarchive \
          -exportPath $PWD/build/Export \
          -exportOptionsPlist exportOptions.plist || true
          
        # Fallback to manual app extraction if export options are missing
        mkdir -p $PWD/build/Export
        cp -a $PWD/build/NotchShelf.xcarchive/Products/Applications/NotchShelf.app $PWD/build/Export/
        
    - name: Ad-Hoc Sign App (Apple Silicon)
      run: |
        codesign --force --deep --sign - $PWD/build/Export/NotchShelf.app
        
    - name: Install create-dmg
      run: brew install create-dmg
      
    - name: Create DMG
      run: |
        create-dmg \
          --volname "NotchShelf" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 128 \
          --app-drop-link 400 185 \
          --icon "NotchShelf.app" 150 185 \
          "NotchShelf.dmg" \
          "$PWD/build/Export/NotchShelf.app"
          
    - name: Generate SHA256 Checksum
      run: shasum -a 256 NotchShelf.dmg > NotchShelf.dmg.sha256
      
    - name: Release to GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: |
          NotchShelf.dmg
          NotchShelf.dmg.sha256
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
