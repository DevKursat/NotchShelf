<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotchShelf Release Status</title>
<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .widget {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 30px;
        width: 350px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
        margin-top: 0;
        font-size: 20px;
        text-align: center;
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .status-list {
        list-style: none;
        padding: 0;
        margin: 20px 0 0 0;
    }
    .status-item {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.05);
        padding: 12px;
        border-radius: 12px;
    }
    .status-item:last-child {
        margin-bottom: 0;
    }
    .check {
        width: 20px;
        height: 20px;
        background: #34c759;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 15px;
        box-shadow: 0 0 10px rgba(52, 199, 89, 0.5);
    }
    .check::after {
        content: '✓';
        color: white;
        font-size: 12px;
        font-weight: bold;
    }
    .text {
        flex: 1;
        opacity: 0.9;
    }
    .badge {
        font-size: 10px;
        background: #007aff;
        padding: 3px 8px;
        border-radius: 10px;
        font-weight: bold;
    }
    .progress-container {
        margin-top: 25px;
    }
    .progress-bar {
        background: rgba(255,255,255,0.1);
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
    }
    .progress-fill {
        background: #34c759;
        width: 100%;
        height: 100%;
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(52, 199, 89, 0.8);
    }
    .progress-text {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        margin-top: 8px;
        color: rgba(255,255,255,0.6);
    }
</style>
</head>
<body>
    <div class="widget">
        <h2>NotchShelf Status</h2>
        <ul class="status-list">
            <li class="status-item">
                <div class="check"></div>
                <div class="text">Volume & Brightness Gestures</div>
                <div class="badge">Native</div>
            </li>
            <li class="status-item">
                <div class="check"></div>
                <div class="text">Media Listener & Visualizer</div>
                <div class="badge">Spotify/Apple</div>
            </li>
            <li class="status-item">
                <div class="check"></div>
                <div class="text">Clipboard Image Support</div>
                <div class="badge">Core</div>
            </li>
            <li class="status-item">
                <div class="check"></div>
                <div class="text">ShelfDropManager UI</div>
                <div class="badge">UI</div>
            </li>
        </ul>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-text">
                <span>Production Ready</span>
                <span>100%</span>
            </div>
        </div>
    </div>
</body>
</html>
